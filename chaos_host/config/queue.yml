# Chaos tuning: one worker, one thread, fast polling — kill semantics must be
# attributable to a single in-flight job.
default: &default
  dispatchers:
    - polling_interval: 0.1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 1
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

production:
  <<: *default
