# Data-only agent config. Model defaults to Silas.config.default_model.
model: claude-sonnet-4-5
description: Support agent for Tinker & Co — order lookups and refunds.
limits:
  max_steps: 10        # a support answer never needs more; caps a runaway loop
  max_cost: 0.25       # dollars per turn — this is a public demo
  timeout: 120         # wall-clock seconds per turn
