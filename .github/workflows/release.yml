# Trusted Publishing (OIDC, no stored API key) — pattern lifted from
# ruby_llm-resilience. One-time setup on rubygems.org:
# Profile -> Trusted publishers -> add publisher for this gem, repo, release.yml.
name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  push:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec
      - uses: rubygems/release-gem@v1
